<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a237e">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>SAT Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- DASHBOARD SCREEN -->
    <div id="screen-dashboard" class="screen">
        <h1>SAT Prep</h1>
        <div class="stats-strip">
            <div class="stat-tile">
                <span class="stat-value" id="stat-due">0</span>
                <span class="stat-label">Cards Due</span>
            </div>
            <div class="stat-tile">
                <span class="stat-value" id="stat-accuracy">&mdash;</span>
                <span class="stat-label">Last Accuracy</span>
            </div>
            <div class="stat-tile">
                <span class="stat-value" id="stat-streak">0</span>
                <span class="stat-label">Day Streak</span>
            </div>
        </div>
        <div class="progress-bars">
            <div class="progress-row">
                <span class="progress-label">Vocabulary</span>
                <div class="progress-track"><div class="progress-fill" id="prog-vocabulary"></div></div>
                <span class="progress-pct" id="pct-vocabulary">0%</span>
            </div>
            <div class="progress-row">
                <span class="progress-label">Grammar</span>
                <div class="progress-track"><div class="progress-fill" id="prog-grammar"></div></div>
                <span class="progress-pct" id="pct-grammar">0%</span>
            </div>
            <div class="progress-row">
                <span class="progress-label">Reading</span>
                <div class="progress-track"><div class="progress-fill" id="prog-reading"></div></div>
                <span class="progress-pct" id="pct-reading">0%</span>
            </div>
        </div>
        <button id="btn-study" class="btn-primary">Study Now (0 cards due)</button>
        <a href="#" id="link-add-cards" class="link-secondary">Add Cards</a>
    </div>

    <!-- STUDY MODE SCREEN -->
    <div id="screen-study" class="screen" style="display:none">
        <div class="study-header">
            <span id="study-category" class="category-label">VOCABULARY</span>
            <span id="study-subcategory" class="subcategory-label">Tier 1</span>
            <span id="study-counter" class="card-counter">Card 1 of 10</span>
            <label class="hint-toggle"><input type="checkbox" id="chk-show-hint"> Show hint</label>
        </div>
        <div class="card-body">
            <p id="study-question" class="question-text"></p>
            <p id="study-context" class="context-text"></p>
        </div>
        <div id="study-choices" class="choices">
            <button class="choice-btn" data-idx="0"></button>
            <button class="choice-btn" data-idx="1"></button>
            <button class="choice-btn" data-idx="2"></button>
            <button class="choice-btn" data-idx="3"></button>
        </div>
        <div id="study-explanation" class="explanation-panel" style="display:none">
            <div class="explanation-right"></div>
            <div class="explanation-traps"></div>
            <div class="explanation-hook"></div>
            <div class="explanation-actions">
                <button id="btn-got-it" class="btn-correct">Got it &rarr; Next</button>
                <button id="btn-tricky" class="btn-tricky">Still tricky &rarr; Next</button>
            </div>
        </div>
        <!-- SESSION END -->
        <div id="study-session-end" class="session-end" style="display:none">
            <h2>Session Complete</h2>
            <p id="session-reviewed"></p>
            <p id="session-accuracy"></p>
            <p id="session-new"></p>
            <button id="btn-back-dashboard" class="btn-primary">Back to Dashboard</button>
        </div>
    </div>

    <!-- ADD CARDS SCREEN -->
    <div id="screen-add-cards" class="screen" style="display:none">
        <h2>Add a Card</h2>
        <form id="form-add-card">
            <div class="form-group">
                <label>Category</label>
                <div class="toggle-group">
                    <button type="button" class="toggle-btn active" data-cat="vocabulary">Vocabulary</button>
                    <button type="button" class="toggle-btn" data-cat="grammar">Grammar</button>
                    <button type="button" class="toggle-btn" data-cat="reading">Reading</button>
                </div>
            </div>
            <div class="form-group">
                <label for="input-question">Question / Word</label>
                <input type="text" id="input-question" required>
            </div>
            <div class="form-group">
                <label for="input-context">Context sentence (optional)</label>
                <input type="text" id="input-context">
            </div>
            <div class="form-group">
                <label for="input-correct">Correct answer</label>
                <input type="text" id="input-correct" required class="input-correct">
            </div>
            <div class="form-group">
                <label for="input-wrong1">Wrong option B</label>
                <input type="text" id="input-wrong1" required>
            </div>
            <div class="form-group">
                <label for="input-wrong2">Wrong option C</label>
                <input type="text" id="input-wrong2" required>
            </div>
            <div class="form-group">
                <label for="input-wrong3">Wrong option D</label>
                <input type="text" id="input-wrong3" required>
            </div>
            <div class="form-group">
                <label for="input-explanation">Coach explanation</label>
                <textarea id="input-explanation" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn-primary">Save Card</button>
            <div id="add-card-success" class="success-msg" style="display:none">Card saved!</div>
        </form>
        <a href="#" id="link-back-dashboard" class="link-secondary">&larr; Back to Dashboard</a>
    </div>

    <script src="cards.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
